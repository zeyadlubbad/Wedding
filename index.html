<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة زفاف</title>
<meta property="og:title" content="دعوة زفاف">
<meta property="og:description" content="يسعدنا دعوتكم لمشاركتنا فرحتنا">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --burgundy:#6b1a2a;
  --burgundy-dark:#4a0f1c;
  --burgundy-light:#8a2a3d;
  --gold:#c9a24b;
  --gold-light:#e8cf8a;
  --cream:#fbf6ec;
  --ink:#3a2a22;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Tajawal',sans-serif;
  background:radial-gradient(circle at top,#7a2335 0%,var(--burgundy-dark) 70%);
  color:var(--ink);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* ===== شاشة الظرف ===== */
#envelopeScreen{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:radial-gradient(circle at center,#7a2335 0%,var(--burgundy-dark) 75%);
  transition:opacity 1s ease, visibility 1s;
}
#envelopeScreen.hide{opacity:0;visibility:hidden}
.hint{
  color:var(--gold-light);font-size:15px;letter-spacing:.5px;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

.envelope{
  position:relative;
  width:min(340px,86vw);
  aspect-ratio:3/2;
  perspective:1200px;
  cursor:pointer;
  animation:float 3.5s ease-in-out infinite;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));
}
.envelope.open{animation:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.env-back{
  position:absolute;inset:0;border-radius:6px;
  background:linear-gradient(145deg,var(--burgundy-light),var(--burgundy));
  border:1px solid rgba(201,162,75,.5);
}
.letter{
  position:absolute;left:6%;right:6%;top:8%;bottom:6%;
  background:var(--cream);border-radius:4px;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:1px solid var(--gold);
  transition:transform 1s cubic-bezier(.2,.8,.2,1) .7s;
}
.letter .mini-title{font-family:'Amiri',serif;color:var(--burgundy);font-size:clamp(18px,5vw,24px)}
.letter .mini-sub{font-size:12px;color:#8a7356}
.envelope.open .letter{transform:translateY(-62%)}

.pocket{position:absolute;inset:0;z-index:3;pointer-events:none}
.pocket span{position:absolute;inset:0;border-radius:6px}
.pocket .left{
  background:linear-gradient(90deg,var(--burgundy),var(--burgundy-light));
  clip-path:polygon(0 0,52% 55%,0 100%);
}
.pocket .right{
  background:linear-gradient(270deg,var(--burgundy),var(--burgundy-light));
  clip-path:polygon(100% 0,48% 55%,100% 100%);
}
.pocket .bottom{
  background:linear-gradient(0deg,var(--burgundy-dark),var(--burgundy));
  clip-path:polygon(0 100%,50% 48%,100% 100%);
}
.flap{
  position:absolute;left:0;right:0;top:0;height:62%;
  z-index:4;transform-origin:top center;
  transition:transform .9s cubic-bezier(.4,.1,.2,1), z-index 0s .45s;
  transform-style:preserve-3d;
}
.flap::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,var(--burgundy-light),var(--burgundy));
  clip-path:polygon(0 0,100% 0,50% 100%);
  border-radius:6px 6px 0 0;
}
.flap::after{ /* خيط ذهبي على حافة الغطاء */
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 96%,var(--gold) 96%);
  clip-path:polygon(0 0,100% 0,50% 100%);opacity:.0;
}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}

.seal{
  position:absolute;left:50%;top:62%;z-index:5;
  width:64px;height:64px;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d9b45e,#a67c2a 60%,#7a5a1a);
  box-shadow:0 4px 10px rgba(0,0,0,.4), inset 0 0 0 4px rgba(255,255,255,.12), inset 0 -4px 8px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Amiri',serif;font-size:20px;color:var(--burgundy-dark);font-weight:700;
  transition:transform .5s ease, opacity .5s ease;
}
.seal::before{
  content:"";position:absolute;inset:6px;border-radius:50%;
  border:1.5px dashed rgba(74,15,28,.45);
}
.envelope.open .seal{transform:translate(-50%,-50%) scale(1.4);opacity:0}

/* ===== محتوى الدعوة ===== */
#invitation{
  opacity:0;transform:translateY(30px);
  transition:opacity 1.2s ease, transform 1.2s ease;
  padding:28px 16px 60px;
  display:flex;justify-content:center;
}
#invitation.show{opacity:1;transform:none}
.card{
  width:100%;max-width:520px;
  background:var(--cream);
  border-radius:14px;
  padding:40px 24px 34px;
  text-align:center;
  position:relative;
  box-shadow:0 25px 60px rgba(0,0,0,.4);
}
.card::before{
  content:"";position:absolute;inset:10px;
  border:1px solid var(--gold);border-radius:10px;pointer-events:none;
}
.card::after{
  content:"";position:absolute;inset:15px;
  border:1px solid rgba(201,162,75,.35);border-radius:8px;pointer-events:none;
}
.section{position:relative;z-index:1;margin-bottom:30px}
.section:last-child{margin-bottom:0}
.reveal{opacity:0;transform:translateY(20px);transition:all .9s ease}
.reveal.visible{opacity:1;transform:none}

.bismillah{font-family:'Amiri',serif;font-size:22px;color:var(--burgundy)}
.verse{
  font-family:'Amiri',serif;font-size:19px;line-height:2;color:var(--ink);margin-top:10px;
}
.verse-ref{font-size:13px;color:#8a7356;margin-top:4px}
.divider{
  display:flex;align-items:center;justify-content:center;gap:10px;margin:22px auto;
  color:var(--gold);
}
.divider::before,.divider::after{
  content:"";height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.parents{display:flex;justify-content:space-around;gap:10px;font-size:15px;line-height:1.8}
.parents small{display:block;color:#8a7356;font-size:12px}
.intro-text{font-size:15px;color:#5b4a3e;line-height:1.9}
.names{
  font-family:'Amiri',serif;font-weight:700;
  font-size:clamp(34px,10vw,46px);color:var(--burgundy);
  line-height:1.3;margin:10px 0;
}
.names .amp{display:block;font-size:26px;color:var(--gold)}
.label{font-size:13px;color:#8a7356;letter-spacing:.5px;margin-bottom:6px}
.date-box{
  display:flex;justify-content:center;align-items:stretch;
  border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);
  padding:12px 0;max-width:330px;margin:0 auto;
}
.date-box div{flex:1;display:flex;flex-direction:column;justify-content:center}
.date-box .mid{border-inline:1px solid var(--gold)}
.date-box .big{font-family:'Amiri',serif;font-size:38px;color:var(--burgundy);line-height:1}
.date-box .small{font-size:14px;color:#5b4a3e}
.info-line{margin-top:12px;font-size:15px;color:#5b4a3e;line-height:1.9}

.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto}
.cd-item{
  background:linear-gradient(160deg,var(--burgundy-light),var(--burgundy));
  color:#fff;border-radius:10px;padding:12px 4px;
  box-shadow:0 6px 14px rgba(107,26,42,.25);
}
.cd-item b{display:block;font-size:26px;font-weight:700;color:var(--gold-light)}
.cd-item span{font-size:12px}
.cd-done{font-family:'Amiri',serif;font-size:22px;color:var(--burgundy)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Tajawal',sans-serif;font-size:16px;font-weight:500;
  padding:13px 26px;border-radius:40px;border:none;cursor:pointer;
  text-decoration:none;transition:transform .2s, box-shadow .2s;
}
.btn:active{transform:scale(.97)}
.btn-gold{
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:var(--burgundy-dark);box-shadow:0 6px 16px rgba(201,162,75,.4);
}
.btn-burgundy{
  background:linear-gradient(135deg,var(--burgundy-light),var(--burgundy));
  color:#fff;box-shadow:0 6px 16px rgba(107,26,42,.35);width:100%;
}
.btn-outline{
  background:transparent;border:1px solid var(--burgundy);color:var(--burgundy);width:100%;margin-top:10px;
}

/* RSVP */
form{text-align:right;max-width:380px;margin:0 auto}
.field{margin-bottom:16px}
.field label.f-label{display:block;font-size:14px;margin-bottom:6px;color:var(--burgundy);font-weight:500}
input[type=text],input[type=number]{
  width:100%;padding:12px 14px;border-radius:10px;
  border:1px solid #d9c9a8;background:#fff;
  font-family:'Tajawal',sans-serif;font-size:16px;color:var(--ink);outline:none;
}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.2)}
.choices{display:flex;gap:10px}
.choices label{flex:1;cursor:pointer}
.choices input{display:none}
.choices span{
  display:block;text-align:center;padding:11px;border-radius:10px;
  border:1px solid #d9c9a8;background:#fff;font-size:15px;transition:all .2s;
}
.choices input:checked + span{background:var(--burgundy);color:#fff;border-color:var(--burgundy)}
#companionsField{transition:opacity .3s}
.footer-note{font-family:'Amiri',serif;font-size:18px;color:var(--burgundy);margin-top:6px}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--burgundy-dark);color:#fff;padding:12px 22px;border-radius:30px;
  font-size:14px;transition:transform .4s;z-index:100;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* لمعات ذهبية خفيفة */
.sparkle{
  position:fixed;top:-10px;width:6px;height:6px;border-radius:50%;
  background:var(--gold-light);opacity:.7;pointer-events:none;z-index:40;
  animation:fall linear forwards;
}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>

<!-- ===== الظرف ===== -->
<div id="envelopeScreen">
  <div class="envelope" id="envelope" role="button" aria-label="افتح الدعوة">
    <div class="env-back"></div>
    <div class="letter">
      <div class="mini-title" id="miniNames"></div>
      <div class="mini-sub">دعوة زفاف</div>
    </div>
    <div class="pocket"><span class="left"></span><span class="right"></span><span class="bottom"></span></div>
    <div class="flap"></div>
    <div class="seal" id="sealText"></div>
  </div>
  <div class="hint">اضغط على الظرف لفتح الدعوة</div>
</div>

<!-- ===== الدعوة ===== -->
<main id="invitation">
  <div class="card">

    <div class="section reveal">
      <div class="bismillah">بسم الله الرحمن الرحيم</div>
      <div class="verse" id="verse"></div>
      <div class="verse-ref" id="verseRef"></div>
    </div>

    <div class="section reveal">
      <div class="parents">
        <div><small>نجل</small><span id="groomFather"></span></div>
        <div><small>كريمة</small><span id="brideFather"></span></div>
      </div>
      <div class="divider">✦</div>
      <p class="intro-text" id="introText"></p>
    </div>

    <div class="section reveal">
      <div class="names">
        <span id="groomName"></span>
        <span class="amp">&</span>
        <span id="brideName"></span>
      </div>
    </div>

    <div class="section reveal">
      <div class="label">وذلك بمشيئة الله تعالى يوم</div>
      <div class="date-box">
        <div><span class="small" id="dayName"></span></div>
        <div class="mid"><span class="big" id="dayNum"></span><span class="small" id="monthName"></span></div>
        <div><span class="small" id="yearNum"></span></div>
      </div>
      <div class="info-line">
        <span id="receptionText"></span><br>
        <span id="venueName"></span>
      </div>
    </div>

    <div class="section reveal">
      <div class="label">العد التنازلي للحفل</div>
      <div class="countdown" id="countdown">
        <div class="cd-item"><b id="cdDays">0</b><span>يوم</span></div>
        <div class="cd-item"><b id="cdHours">0</b><span>ساعة</span></div>
        <div class="cd-item"><b id="cdMins">0</b><span>دقيقة</span></div>
        <div class="cd-item"><b id="cdSecs">0</b><span>ثانية</span></div>
      </div>
    </div>

    <div class="section reveal">
      <a class="btn btn-gold" id="mapBtn" target="_blank" rel="noopener">📍 موقع القاعة على الخريطة</a>
    </div>

    <div class="divider">✦</div>

    <div class="section reveal">
      <div class="names" style="font-size:28px">تأكيد الحضور</div>
      <p class="intro-text" style="margin-bottom:18px" id="rsvpNote"></p>
      <form id="rsvpForm">
        <div class="field">
          <label class="f-label" for="guestName">الاسم الكريم</label>
          <input type="text" id="guestName" placeholder="اكتب اسمك" required>
        </div>
        <div class="field">
          <label class="f-label">هل ستشاركنا الفرحة؟</label>
          <div class="choices">
            <label><input type="radio" name="attend" value="yes" checked><span>سأحضر بإذن الله</span></label>
            <label><input type="radio" name="attend" value="no"><span>أعتذر</span></label>
          </div>
        </div>
        <div class="field" id="companionsField">
          <label class="f-label" for="companions">عدد المرافقين</label>
          <input type="number" id="companions" min="0" max="10" value="0">
        </div>
        <button type="submit" class="btn btn-burgundy">إرسال التأكيد عبر واتساب</button>
        <a class="btn btn-outline" id="formBtn" target="_blank" rel="noopener" style="display:none">أو التأكيد عبر نموذج Google</a>
      </form>
    </div>

    <div class="section reveal">
      <div class="divider">✦</div>
      <div class="footer-note" id="footerNote"></div>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ✏️ عدّل كل بيانات الدعوة من هنا فقط
   ========================================================= */
const CONFIG = {
  groomName:   "زياد",
  brideName:   "لولو",
  groomFather: "السيد أسامة زياد لبد",
  brideFather: "السيد محمود فوزي البياع",
  sealLetters: "ز ♥ ل",

  introText: "يتشرفان بدعوتكم لحضور حفل زفاف أبنائهم",

  verse: "﴿ وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً ﴾",
  verseRef: "سورة الروم – الآية 21",

  // موعد الحفل: السنة-الشهر-اليوم T الساعة:الدقيقة  ثم فرق التوقيت (+02:00 شتاءً في فلسطين، +03:00 صيفاً)
  eventDate: "2031-08-20T20:00:00+03:00",

  receptionText: "استقبال المدعوين من الساعة الثامنة مساءً",
  venueName:     "قاعة أبو هويدي",
  mapUrl:        "https://maps.app.goo.gl/SVZEP462sEdfZMvN8?g_st=ipc",

  // رقم واتساب لاستقبال التأكيدات (بالصيغة الدولية بدون + أو أصفار في البداية)
  whatsappNumber: "972567566621",

  // رابط نموذج Google (اختياري) — اتركه فارغاً "" لإخفاء الزر
  googleFormUrl: "",

  rsvpNote:   "نرجو تأكيد حضوركم قبل موعد الحفل بأسبوع",
  footerNote: "بحضوركم تكتمل فرحتنا"
};
/* ========================================================= */

const $ = id => document.getElementById(id);

// تعبئة النصوص
const fill = {
  groomName:CONFIG.groomName, brideName:CONFIG.brideName,
  groomFather:CONFIG.groomFather, brideFather:CONFIG.brideFather,
  introText:CONFIG.introText, verse:CONFIG.verse, verseRef:CONFIG.verseRef,
  receptionText:CONFIG.receptionText, venueName:CONFIG.venueName,
  rsvpNote:CONFIG.rsvpNote, footerNote:CONFIG.footerNote
};
for (const k in fill) $(k).textContent = fill[k];
$("miniNames").textContent = `${CONFIG.groomName} & ${CONFIG.brideName}`;
$("sealText").textContent = CONFIG.sealLetters;
$("mapBtn").href = CONFIG.mapUrl;
if (CONFIG.googleFormUrl){ $("formBtn").href = CONFIG.googleFormUrl; $("formBtn").style.display = "inline-flex"; }
document.title = `دعوة زفاف ${CONFIG.groomName} و${CONFIG.brideName}`;

// التاريخ
const eventDate = new Date(CONFIG.eventDate);
$("dayName").textContent  = eventDate.toLocaleDateString("ar", {weekday:"long"});
$("dayNum").textContent   = eventDate.toLocaleDateString("ar", {day:"numeric"});
$("monthName").textContent= eventDate.toLocaleDateString("ar", {month:"long"});
$("yearNum").textContent  = eventDate.toLocaleDateString("ar", {year:"numeric"});

// العد التنازلي
function tick(){
  const diff = eventDate - new Date();
  if (diff <= 0){
    $("countdown").outerHTML = '<div class="cd-done">🎉 حان موعد الفرح، مبارك للعروسين</div>';
    clearInterval(timer); return;
  }
  $("cdDays").textContent  = Math.floor(diff/86400000);
  $("cdHours").textContent = Math.floor(diff/3600000)%24;
  $("cdMins").textContent  = Math.floor(diff/60000)%60;
  $("cdSecs").textContent  = Math.floor(diff/1000)%60;
}
const timer = setInterval(tick,1000); tick();

// فتح الظرف
let opened = false;
$("envelope").addEventListener("click", () => {
  if (opened) return; opened = true;
  $("envelope").classList.add("open");
  sparkles(40);
  setTimeout(() => {
    $("envelopeScreen").classList.add("hide");
    $("invitation").classList.add("show");
    window.scrollTo(0,0);
  }, 2100);
});

// ظهور الأقسام عند التمرير
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add("visible"); io.unobserve(e.target);} });
},{threshold:.15});
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

// لمعات ذهبية
function sparkles(n){
  for (let i=0;i<n;i++){
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random()*100 + "vw";
    s.style.animationDuration = 3 + Math.random()*3 + "s";
    s.style.animationDelay = Math.random()*1.5 + "s";
    const size = 3 + Math.random()*5;
    s.style.width = s.style.height = size + "px";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 7000);
  }
}

// إظهار/إخفاء عدد المرافقين
document.querySelectorAll('input[name="attend"]').forEach(r => r.addEventListener("change", () => {
  const yes = document.querySelector('input[name="attend"]:checked').value === "yes";
  $("companionsField").style.opacity = yes ? 1 : .35;
  $("companions").disabled = !yes;
}));

// إرسال التأكيد عبر واتساب
$("rsvpForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("guestName").value.trim();
  if (!name){ showToast("الرجاء كتابة الاسم"); return; }
  const yes = document.querySelector('input[name="attend"]:checked').value === "yes";
  const comp = parseInt($("companions").value) || 0;
  let msg = `السلام عليكم 🌸\nأنا: ${name}\n`;
  msg += yes
    ? `✅ أؤكد حضوري حفل زفاف ${CONFIG.groomName} و${CONFIG.brideName}\nعدد المرافقين: ${comp}`
    : `🙏 أعتذر عن الحضور، وأبارك للعروسين ${CONFIG.groomName} و${CONFIG.brideName}، بارك الله لهما.`;
  window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`, "_blank");
  showToast("شكراً لك، سيتم فتح واتساب للإرسال");
});

function showToast(t){
  $("toast").textContent = t;
  $("toast").classList.add("show");
  setTimeout(()=>$("toast").classList.remove("show"), 2800);
}
</script>
</body>
</html>
