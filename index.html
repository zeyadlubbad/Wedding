<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3a0d18">
<title>دعوة زفاف</title>
<meta property="og:title" content="دعوة زفاف">
<meta property="og:description" content="يسعدنا دعوتكم لمشاركتنا فرحتنا">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#3a0d18;
  --wine-2:#5a1a28;
  --wine-3:#7a2a3a;
  --rose:#c98a80;
  --gold:#d4a64a;
  --gold-2:#f3d488;
  --cream:#fbf3ea;
  --cream-2:#f3e2d6;
  --ink:#2a1015;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--cream);
  color:var(--ink);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
body.locked{overflow:hidden;height:100vh}

/* ================= شاشة الظرف ================= */
#intro{
  position:fixed;inset:0;z-index:50;overflow:hidden;
  background:var(--wine);
  perspective:1400px;
  cursor:pointer;
}
#intro.gone{display:none}
.layer{position:absolute;inset:0;width:100%;height:100%}
.flora{
  filter:drop-shadow(1.5px 2px 0 rgba(20,0,5,.55)) drop-shadow(-1px -1px 0 rgba(255,210,190,.18));
}
.vignette{
  background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(15,0,4,.65) 100%);
  pointer-events:none;
}
.inner-light{
  clip-path:polygon(0 0,100% 0,50% 48%);
  background:
    radial-gradient(ellipse at 50% 48%,#fff8dc 0%,var(--gold-2) 18%,var(--gold) 45%,rgba(120,60,10,.0) 80%),
    linear-gradient(180deg,#a8742a,#f0c96a);
  opacity:0;
  transition:opacity 1s ease;
}
.bottom-flap{
  clip-path:polygon(0 100%,50% 48%,100% 100%);
  background:linear-gradient(0deg,#2a0811 0%,#47121f 70%,#5a1a28 100%);
}
.flap{
  clip-path:polygon(0 0,100% 0,50% 48%);
  background:
    linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.15)),
    linear-gradient(160deg,#6e2232 0%,#561826 55%,#4a1320 100%);
  transform-origin:50% 0;
  transition:transform 1.4s cubic-bezier(.5,0,.2,1);
  z-index:4;
}
.edges{pointer-events:none;z-index:5}
.edges line{stroke:url(#edgeGold);stroke-width:2;vector-effect:non-scaling-stroke}
#intro.opening .edges{opacity:0;transition:opacity .4s}

.seal{
  position:absolute;left:50%;top:48%;z-index:6;
  width:118px;height:118px;transform:translate(-50%,-50%);
  transition:top 1.4s cubic-bezier(.5,0,.2,1), opacity .8s ease .9s, filter .6s;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.55));
  animation:breathe 2.6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}
#intro.opening .seal{top:6%;opacity:0;animation:none;filter:drop-shadow(0 0 22px rgba(255,220,140,.9))}
#intro.opening .flap{transform:rotateX(178deg)}
#intro.opening .inner-light{opacity:1}

.hint{
  position:absolute;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom));z-index:7;
  text-align:center;color:var(--gold-2);font-size:15px;letter-spacing:.5px;
  animation:pulse 2.2s ease-in-out infinite;
}
#intro.opening .hint{opacity:0;animation:none;transition:opacity .3s}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

#flash{
  position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%,#fff 0%,#fff6dc 45%,#f4d48a 100%);
  transition:opacity .7s ease;
}
#flash.on{opacity:1}

/* ================= الصفحة ================= */
main{
  max-width:460px;margin:0 auto;padding:34px 16px 110px;
  background:
    radial-gradient(circle at 20% 10%,rgba(201,138,128,.08),transparent 40%),
    radial-gradient(circle at 80% 60%,rgba(212,166,74,.07),transparent 40%);
}
.reveal{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s ease}
.reveal.visible{opacity:1;transform:none}

.wd-title{
  font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:7px;
  text-align:center;color:var(--wine);direction:ltr;margin-bottom:18px;
}

/* الظرف الصغير مع الصورة */
.hero{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:1/0.95}
.mini-env{position:absolute;left:8%;right:0;bottom:0;height:62%}
.mini-env .back{
  position:absolute;inset:0;background:linear-gradient(170deg,#5a1a28,#3a0d18);
  border-radius:4px;
}
.mini-env .open-flap{
  position:absolute;left:0;right:0;bottom:100%;height:55%;
  background:linear-gradient(0deg,#4a1320,#6a2333);
  clip-path:polygon(0 100%,50% 0,100% 100%);
}
.mini-env .front{
  position:absolute;inset:0;z-index:3;border-radius:4px;
  background:linear-gradient(180deg,#6a2333,#47121f);
  clip-path:polygon(0 0,50% 42%,100% 0,100% 100%,0 100%);
  box-shadow:inset 0 0 30px rgba(0,0,0,.4);
}
.photo{
  position:absolute;z-index:2;left:28%;right:12%;top:6%;height:66%;
  background:#fff;padding:8px 8px 8px;
  transform:rotate(4deg);
  box-shadow:0 10px 24px rgba(0,0,0,.3);
}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .mono{
  width:100%;height:100%;
  background:linear-gradient(160deg,#f7ebe0,#ead4c4);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-family:'Amiri',serif;color:var(--wine);
}
.photo .mono b{font-size:44px;line-height:1.1}
.photo .mono small{font-family:'Cormorant Garamond',serif;letter-spacing:3px;font-size:13px;color:#9a6a5a;direction:ltr}
.heart-seal{
  position:absolute;z-index:4;left:calc(54% - 30px);top:calc(38% + 38% * .42 + 4px);
  width:60px;height:60px;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));
}
.bouquet{position:absolute;z-index:5;left:-4%;top:12%;width:44%}

.names{
  font-family:'Amiri',serif;font-weight:700;text-align:center;color:var(--wine);
  font-size:clamp(46px,14vw,60px);line-height:1.25;margin:22px 0 26px;
}
.names .amp{display:block;font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold);font-weight:500;line-height:1;margin:18px 0 22px}

/* الكروت */
.card{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 100% 0%,rgba(122,42,58,.45),transparent 50%),
    linear-gradient(170deg,#3e1019 0%,#2a0a11 100%);
  color:var(--cream);
  border-radius:30px;padding:34px 22px 30px;margin-bottom:22px;text-align:center;
  box-shadow:0 18px 40px rgba(58,13,24,.35);
}
.card::before{
  content:"";position:absolute;inset:8px;border-radius:24px;
  border:1px solid rgba(212,166,74,.22);pointer-events:none;
}
.card h2{font-family:'Amiri',serif;font-weight:400;font-size:27px;margin-bottom:22px}
.muted{color:#c9a9a3;font-size:13px}
.parents{display:flex;align-items:stretch;justify-content:center;margin-bottom:20px}
.parents>div{flex:1;padding:0 6px}
.parents>div+div{border-inline-start:1px solid rgba(255,255,255,.15)}
.parents b{display:block;font-size:16px;font-weight:700;margin-top:6px}
.invite-line{font-size:14px;color:#dcc3bd;margin-bottom:18px}
.names-row{display:flex;justify-content:space-around;font-family:'Amiri',serif;font-size:30px;margin-bottom:16px}
.sm-line{font-size:14px;color:#dcc3bd;line-height:1.9}
.stack-names{margin:26px 0 8px;font-family:'Amiri',serif}
.stack-names .n{font-size:36px;line-height:1.1}
.stack-names .lbl{font-family:'Tajawal';font-size:12px;color:#b8938c;margin-bottom:6px}
.stack-names .amp{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:24px;margin:4px 0}
.sep{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);margin:22px 0}
.when-label{font-size:15px;margin-bottom:12px}
.day-time{display:flex;justify-content:space-around;font-size:15px;margin-bottom:14px}
.date-block{display:flex;align-items:center;justify-content:center;gap:18px}
.date-block .big{font-family:'Cormorant Garamond',serif;font-size:62px;line-height:1;font-weight:500}
.date-block .bar{width:1px;height:58px;background:rgba(255,255,255,.2)}
.date-block .my{display:flex;flex-direction:column;gap:6px;color:var(--gold-2);font-size:15px}
.times{display:flex;justify-content:space-around;margin-top:20px}
.times b{display:block;font-size:20px;margin-top:6px;font-family:'Cormorant Garamond',serif;font-weight:600;direction:ltr}

.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px auto 22px;max-width:320px}
.cd{border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 2px;background:rgba(255,255,255,.03)}
.cd b{display:block;font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:500;line-height:1.1}
.cd span{font-size:11px;color:#c9a9a3}
.cd-done{font-family:'Amiri',serif;font-size:22px;color:var(--gold-2);margin:14px 0 22px}

.calendar{
  background:var(--cream-2);color:var(--ink);border-radius:22px;padding:18px 14px 14px;
}
.calendar .cal-title{font-family:'Amiri',serif;font-size:22px;font-weight:700;color:var(--wine);
  padding-bottom:10px;border-bottom:1px solid rgba(58,13,24,.15);margin-bottom:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:10px;font-size:15px}
.cal-grid .wd{font-size:12px;color:#9a7a72;padding-bottom:8px;border-bottom:2px solid var(--wine);margin-bottom:4px}
.cal-grid .d{height:32px;display:flex;align-items:center;justify-content:center}
.cal-grid .d.hit span{
  background:var(--wine);color:#fff;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  box-shadow:0 0 0 4px rgba(58,13,24,.12);animation:hitpulse 2s ease-in-out infinite;
}
@keyframes hitpulse{0%,100%{box-shadow:0 0 0 3px rgba(58,13,24,.15)}50%{box-shadow:0 0 0 8px rgba(58,13,24,.05)}}

.link{display:inline-block;margin:18px 0 16px;color:#e8bfa8;font-size:14px;text-decoration:underline;text-underline-offset:5px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-family:'Tajawal',sans-serif;font-size:16px;font-weight:700;
  padding:16px 20px;border-radius:40px;border:none;cursor:pointer;text-decoration:none;
  transition:transform .15s;
}
.btn:active{transform:scale(.97)}
.btn-cream{background:var(--cream);color:var(--wine)}
.btn-ghost{background:transparent;color:var(--cream);border:1px solid rgba(255,255,255,.35);margin-top:12px}
.btn-wine{background:var(--wine);color:#fff}

.verse{
  text-align:center;font-family:'Amiri',serif;color:var(--wine);
  font-size:19px;line-height:2.1;margin:6px 6px 26px;
}
.verse small{display:block;font-family:'Tajawal';font-size:12px;color:#9a7a72}
.footer{text-align:center;font-family:'Amiri',serif;font-size:22px;color:var(--wine);margin-top:8px}


/* نافذة تأكيد الحضور */
#sheet{position:fixed;inset:0;z-index:80;display:none}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(20,4,8,.55);animation:fadein .3s}
#sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;
  background:var(--cream);border-radius:28px 28px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));
  animation:up .35s cubic-bezier(.2,.8,.2,1);
}
@keyframes fadein{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
.panel h3{font-family:'Amiri',serif;font-size:26px;color:var(--wine);text-align:center;margin-bottom:16px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:14px;margin-bottom:6px;color:var(--wine);font-weight:500}
.field input[type=text],.field input[type=number]{
  width:100%;padding:13px 14px;border-radius:14px;border:1px solid #e0cbbd;background:#fff;
  font-family:'Tajawal';font-size:16px;outline:none;color:var(--ink);
}
.field input:focus{border-color:var(--wine)}
.choices{display:flex;gap:10px}
.choices label{flex:1}
.choices input{display:none}
.choices span{display:block;text-align:center;padding:12px;border-radius:14px;border:1px solid #e0cbbd;background:#fff;cursor:pointer}
.choices input:checked+span{background:var(--wine);color:#fff;border-color:var(--wine)}
.close-x{position:absolute;top:14px;left:16px;background:none;border:none;font-size:26px;color:#9a7a72;cursor:pointer}
</style>
</head>
<body class="locked">

<!-- ================= الظرف ================= -->
<div id="intro" aria-label="افتح الدعوة" role="button">
  <!-- نقوش الورد البارزة -->
  <svg class="layer flora" aria-hidden="true">
    <defs>
      <path id="petal" d="M0 -10 C 9 -20, 9 -32, 0 -40 C -9 -32, -9 -20, 0 -10Z"/>
      <path id="leaf"  d="M0 0 C 6 -2, 12 -6, 16 -14 C 8 -12, 3 -7, 0 0Z"/>
      <g id="fern">
        <path d="M0 0 C 2 -30, 0 -60, -6 -92"/>
        <use href="#leaf" transform="translate(0 -10)"/><use href="#leaf" transform="translate(0 -10) scale(-1 1)"/>
        <use href="#leaf" transform="translate(0 -24) scale(.95)"/><use href="#leaf" transform="translate(0 -24) scale(-.95 .95)"/>
        <use href="#leaf" transform="translate(-1 -38) scale(.85)"/><use href="#leaf" transform="translate(-1 -38) scale(-.85 .85)"/>
        <use href="#leaf" transform="translate(-2 -52) scale(.75)"/><use href="#leaf" transform="translate(-2 -52) scale(-.75 .75)"/>
        <use href="#leaf" transform="translate(-3 -65) scale(.6)"/><use href="#leaf" transform="translate(-3 -65) scale(-.6 .6)"/>
        <use href="#leaf" transform="translate(-5 -78) scale(.45)"/><use href="#leaf" transform="translate(-5 -78) scale(-.45 .45)"/>
      </g>
      <g id="flower">
        <use href="#petal"/><use href="#petal" transform="rotate(36)"/><use href="#petal" transform="rotate(72)"/>
        <use href="#petal" transform="rotate(108)"/><use href="#petal" transform="rotate(144)"/><use href="#petal" transform="rotate(180)"/>
        <use href="#petal" transform="rotate(216)"/><use href="#petal" transform="rotate(252)"/><use href="#petal" transform="rotate(288)"/>
        <use href="#petal" transform="rotate(324)"/>
        <g transform="rotate(18) scale(.62)">
          <use href="#petal"/><use href="#petal" transform="rotate(72)"/><use href="#petal" transform="rotate(144)"/>
          <use href="#petal" transform="rotate(216)"/><use href="#petal" transform="rotate(288)"/>
        </g>
        <circle r="7"/><circle r="3"/>
        <circle cx="4" cy="-2" r=".8"/><circle cx="-3" cy="3" r=".8"/><circle cx="-2" cy="-4" r=".8"/>
      </g>
      <pattern id="floraPat" width="170" height="210" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#d99285" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
          <use href="#flower" transform="translate(85 78)"/>
          <use href="#fern" transform="translate(18 205) rotate(-28)"/>
          <use href="#fern" transform="translate(160 10) rotate(160)"/>
          <use href="#fern" transform="translate(150 200) rotate(25) scale(.7)"/>
          <use href="#flower" transform="translate(10 120) scale(.42)"/>
          <use href="#flower" transform="translate(160 150) scale(.35)"/>
          <path d="M40 150 c10 -10 20 -10 30 -2 M120 30 c-8 8 -18 10 -26 6"/>
          <circle cx="58" cy="20" r="2.2"/><circle cx="66" cy="14" r="1.6"/><circle cx="130" cy="120" r="2"/>
        </g>
      </pattern>
      <linearGradient id="edgeGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8a5a1a" stop-opacity=".2"/>
        <stop offset=".6" stop-color="#f3d488"/>
        <stop offset="1" stop-color="#fff2c8"/>
      </linearGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#floraPat)"/>
  </svg>
  <div class="layer inner-light"></div>
  <div class="layer bottom-flap"></div>
  <div class="layer vignette"></div>
  <div class="layer flap"></div>
  <svg class="layer edges" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="0" x2="50" y2="48"/><line x1="100" y1="0" x2="50" y2="48"/>
    <line x1="0" y1="100" x2="50" y2="48" style="opacity:.35"/><line x1="100" y1="100" x2="50" y2="48" style="opacity:.35"/>
  </svg>

  <!-- ختم الشمع -->
  <svg class="seal" viewBox="0 0 120 120" aria-hidden="true">
    <defs>
      <radialGradient id="wax" cx="38%" cy="32%" r="75%">
        <stop offset="0" stop-color="#b8707a"/>
        <stop offset=".45" stop-color="#7e3644"/>
        <stop offset="1" stop-color="#4a1520"/>
      </radialGradient>
      <radialGradient id="waxIn" cx="50%" cy="40%" r="65%">
        <stop offset="0" stop-color="#6e2b38"/><stop offset="1" stop-color="#4c1622"/>
      </radialGradient>
      <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fbe3a2"/><stop offset=".5" stop-color="#d9aa4f"/><stop offset="1" stop-color="#a87a2a"/>
      </linearGradient>
    </defs>
    <path fill="url(#wax)" d="M60 4c9 0 13 5 21 7s14 1 19 8 2 13 6 20 10 11 9 20-7 12-9 20 1 15-6 21-14 3-21 6-12 10-20 10-12-6-20-9-15 0-20-7-2-13-6-21S2 68 3 60s7-12 9-20-2-14 5-20 14-2 21-6S51 4 60 4z"/>
    <circle cx="60" cy="60" r="38" fill="url(#waxIn)"/>
    <circle cx="60" cy="60" r="38" fill="none" stroke="#2e0a12" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="60" cy="60" r="35" fill="none" stroke="#c98a8a" stroke-opacity=".35" stroke-width="1"/>
    <g fill="url(#goldG)" stroke="url(#goldG)" stroke-linecap="round">
      <path d="M60 88 L60 36" stroke-width="2" fill="none"/>
      <ellipse cx="60" cy="33" rx="3.2" ry="6"/>
      <ellipse cx="53" cy="44" rx="3" ry="7" transform="rotate(-40 53 44)"/>
      <ellipse cx="67" cy="44" rx="3" ry="7" transform="rotate(40 67 44)"/>
      <ellipse cx="51" cy="55" rx="3.2" ry="8" transform="rotate(-50 51 55)"/>
      <ellipse cx="69" cy="55" rx="3.2" ry="8" transform="rotate(50 69 55)"/>
      <ellipse cx="50" cy="67" rx="3.3" ry="8.5" transform="rotate(-58 50 67)"/>
      <ellipse cx="70" cy="67" rx="3.3" ry="8.5" transform="rotate(58 70 67)"/>
      <ellipse cx="52" cy="78" rx="2.8" ry="6.5" transform="rotate(-62 52 78)"/>
      <ellipse cx="68" cy="78" rx="2.8" ry="6.5" transform="rotate(62 68 78)"/>
    </g>
  </svg>

  <div class="hint">اضغط على الختم لفتح الدعوة</div>
</div>
<div id="flash"></div>

<!-- ================= الدعوة ================= -->
<main id="page">
  <div class="wd-title reveal">Wedding Day</div>

  <div class="hero reveal">
    <div class="mini-env">
      <div class="open-flap"></div>
      <div class="back"></div>
      <div class="front"></div>
    </div>
    <div class="photo" id="photoBox"></div>
    <svg class="heart-seal" viewBox="0 0 60 60" aria-hidden="true">
      <defs>
        <radialGradient id="hs" cx="35%" cy="30%" r="80%">
          <stop offset="0" stop-color="#ffe8a8"/><stop offset=".5" stop-color="#d4a64a"/><stop offset="1" stop-color="#8f6420"/>
        </radialGradient>
      </defs>
      <path fill="url(#hs)" d="M30 2c5 0 7 3 11 4s8 0 10 4 1 7 3 11 5 5 4 9-4 7-5 11 0 8-4 10-7 1-11 3-6 5-10 5-6-3-10-4-8 0-10-4-1-7-3-11S2 34 2 30s4-6 5-10-1-8 3-10 7-1 11-3 5-5 9-5z"/>
      <circle cx="30" cy="30" r="19" fill="none" stroke="#8f6420" stroke-opacity=".5"/>
      <path d="M30 40 C 18 32, 19 22, 25 21 C 28 20.5, 30 23, 30 25 C 30 23, 32 20.5, 35 21 C 41 22, 42 32, 30 40Z" fill="none" stroke="#7a521a" stroke-width="2"/>
    </svg>
    <!-- باقة ورد -->
    <svg class="bouquet" viewBox="0 0 150 230" aria-hidden="true">
      <defs>
        <radialGradient id="rw" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#9a2e44"/><stop offset="1" stop-color="#4a0f1e"/></radialGradient>
        <radialGradient id="rc" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#d9c3a8"/></radialGradient>
      </defs>
      <g stroke="#6b7a5a" stroke-width="1.5" fill="none" stroke-linecap="round">

  <div class="names reveal">
    <span id="groomBig"></span>

  <!-- كرت معلومات الحفل -->
  <section class="card reveal">
    <h2>معلومات الحفل</h2>
    <div class="parents">
      <div><span class="muted">اسم والد العريس</span><b id="groomFather"></b></div>
      <div><span class="muted">اسم والد العروس</span><b id="brideFather"></b></div>
    </div>
    <p class="invite-line" id="inviteLine"></p>
    <div class="names-row"><span id="groomS"></span><span id="brideS"></span></div>
    <p class="sm-line" id="dateLine"></p>
    <p class="sm-line" id="timeLine"></p>
    <p class="sm-line" id="venueLine"></p>

    <div class="stack-names">
      <div class="n" id="groomS2"></div><div class="lbl">العريس</div>
      <div class="amp">&</div>
      <div class="n" id="brideS2"></div><div class="lbl">العروس</div>
    </div>

    <div class="sep"></div>

      <div class="my"><span id="month1"></span><span id="year1"></span></div>
      <div class="bar"></div>
      <div class="big" id="dayNum1"></div>
    </div>
    <a class="btn btn-ghost" id="mapBtn" target="_blank" rel="noopener" style="margin-top:24px">📍 موقع القاعة على الخريطة</a>

  <!-- كرت حفل الاستقبال -->
  <section class="card reveal">
    <h2>معلومات حفل الاستقبال</h2>
    <p class="muted" style="margin-bottom:10px">ستقام حفلة الاستقبال في:</p>
    <div class="day-time"><span id="dayName2"></span><span id="startTxt2"></span></div>
    <div class="date-block">
      <div class="my"><span id="month2"></span><span id="year2"></span></div>
      <div class="bar"></div>
      <div class="big" id="dayNum2"></div>
    </div>
    <div class="times">
      <div><span class="muted">استقبال الضيوف</span><b id="guestsTime"></b></div>
      <div><span class="muted">بدء الحفل</span><b id="startTime"></b></div>
    </div>

    <div class="sep"></div>
    <div class="when-label">العد التنازلي</div>
    <div class="countdown" id="countdown">
      <div class="cd"><b id="cdD">0</b><span>يوم</span></div>
      <div class="cd"><b id="cdH">0</b><span>ساعة</span></div>
      <div class="cd"><b id="cdM">0</b><span>دقيقة</span></div>
      <div class="cd"><b id="cdS">0</b><span>ثانية</span></div>
    </div>

    <div class="calendar">
      <div class="cal-title" id="calTitle"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <a class="link" id="calLink" target="_blank" rel="noopener">أضف إلى التقويم</a>
    <button class="btn btn-cream" id="openRsvp">تأكيد الحضور</button>

  <div class="footer reveal" id="footerNote"></div>
</main>

<audio id="song" preload="auto" playsinline></audio>

<!-- نافذة تأكيد الحضور -->
<div id="sheet">
  <div class="bg" id="sheetBg"></div>
  <div class="panel">
    <button class="close-x" id="closeSheet" aria-label="إغلاق">×</button>
    <h3>تأكيد الحضور</h3>
    <form id="rsvpForm">
      <div class="field">
        <label for="guestName">الاسم الكريم</label>
        <input type="text" id="guestName" placeholder="اكتب اسمك" required>
      </div>
      <div class="field">
        <label>هل ستشاركنا الفرحة؟</label>
        <div class="choices">
          <label><input type="radio" name="attend" value="yes" checked><span>سأحضر بإذن الله</span></label>
          <label><input type="radio" name="attend" value="no"><span>أعتذر</span></label>
        </div>
      </div>
      <div class="field" id="compField">
        <label for="companions">عدد المرافقين</label>
        <input type="number" id="companions" min="0" max="10" value="0">
      </div>
      <button type="submit" class="btn btn-wine">إرسال عبر واتساب</button>
    </form>
  </div>
</div>

<script>
/* =========================================================
   ✏️ عدّل كل بيانات الدعوة من هنا فقط
   ========================================================= */
const CONFIG = {
  groomName:   "زِيَاد",            // الاسم بالتشكيل (للعرض الكبير)
  brideName:   "لُولُو",
  groomFather: "أسامة زياد لبد",
  brideFather: "محمود فوزي البياع",

  inviteLine: "يدعوانكم لحضور حفل زفاف ابنيهما",

  verse: "﴿ وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً ﴾",
  verseRef: "سورة الروم – 21",

  // موعد بدء الحفل (للعد التنازلي والتقويم): السنة-الشهر-اليوم T الساعة:الدقيقة + فرق التوقيت
  eventDate:  "2031-08-20T20:00:00+03:00",
  guestsTime: "20:00",   // وقت استقبال الضيوف
  startTime:  "20:30",   // وقت بدء الحفل

  venueName: "قاعة أبو هويدي",
  mapUrl:    "https://maps.app.goo.gl/SVZEP462sEdfZMvN8?g_st=ipc",

  whatsappNumber: "972567566621",   // بدون + وبدون أصفار في البداية

  // صورة العروسين (اختياري): ارفع الصورة بجانب index.html واكتب اسمها هنا مثل "photo.jpg"
  photo: "",

  // الموسيقى: ارفع ملف الأغنية بجانب index.html باسم song.mp3 — تشتغل تلقائياً أول ما ينفتح الظرف
  musicFile: "Song.m4a",
  musicStartAt: 0,       // من أي ثانية تبدأ الأغنية (مثلاً 35)

  footerNote: "بحضوركم تكتمل فرحتنا"
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const plain = s => s.replace(/[ً-ْ]/g, "");
const LOC = "ar-u-nu-latn";

$("groomBig").textContent = CONFIG.groomName;
$("brideBig").textContent = CONFIG.brideName;
["groomS","groomS2"].forEach(i => $(i).textContent = CONFIG.groomName);
["brideS","brideS2"].forEach(i => $(i).textContent = CONFIG.brideName);
$("groomFather").textContent = CONFIG.groomFather;
$("brideFather").textContent = CONFIG.brideFather;
$("inviteLine").textContent  = CONFIG.inviteLine;
$("verse").textContent       = CONFIG.verse;
$("verseRef").textContent    = CONFIG.verseRef;
$("footerNote").textContent  = CONFIG.footerNote;
$("guestsTime").textContent  = CONFIG.guestsTime;
$("startTime").textContent   = CONFIG.startTime;
$("mapBtn").href = CONFIG.mapUrl;
document.title = `دعوة زفاف ${plain(CONFIG.groomName)} و${plain(CONFIG.brideName)}`;

// صورة العروسين: إذا ما في صورة حقيقية بتظهر رسمة
const COUPLE_SVG = `<svg viewBox="0 0 200 230" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block">
<defs>
 <radialGradient id="nightBg" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#4a3a36"/><stop offset=".55" stop-color="#1e1416"/><stop offset="1" stop-color="#0b0708"/></radialGradient>
 <linearGradient id="veilG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#f3ece6" stop-opacity=".8"/></linearGradient>
 <linearGradient id="suitG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#0e0e10"/></linearGradient>
 <linearGradient id="skinG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2b593"/><stop offset="1" stop-color="#b9876a"/></linearGradient>
</defs>
<rect width="200" height="230" fill="url(#nightBg)"/>
<g fill="#f6d68a"><circle cx="30" cy="40" r="3" opacity=".35"/><circle cx="170" cy="30" r="4" opacity=".3"/><circle cx="160" cy="80" r="2.5" opacity=".4"/><circle cx="22" cy="110" r="2" opacity=".35"/><circle cx="185" cy="140" r="3" opacity=".25"/><circle cx="45" cy="18" r="1.8" opacity=".5"/></g>
<path d="M32 230 C 34 170, 46 138, 72 128 L 98 124 C 112 132, 118 160, 116 230 Z" fill="url(#suitG)"/>
<path d="M78 128 L 86 160 L 94 126 Z" fill="#f4f1ee"/>
<path d="M84 132 l3 -3 l3 3 l-3 3z M84 132 l-5 -3 v6z M90 132 l5 -3 v6z" fill="#111"/>
<path d="M72 128 L 86 168 L 64 140 Z M98 124 L 86 168 L 104 134Z" fill="#1b1b1e"/>
<rect x="80" y="104" width="12" height="22" rx="5" fill="url(#skinG)"/>
<ellipse cx="88" cy="88" rx="17" ry="20" fill="url(#skinG)"/>
<path d="M71 86 C 68 64, 86 60, 98 66 C 106 70, 106 80, 104 86 C 100 76, 86 74, 76 80 Z" fill="#1a1210"/>
<ellipse cx="73" cy="90" rx="3" ry="5" fill="#c69276"/>
<path d="M100 230 C 98 180, 104 150, 118 136 C 132 124, 150 128, 160 150 C 172 176, 176 205, 178 230 Z" fill="#f7f2ec"/>
<ellipse cx="124" cy="88" rx="16" ry="19" fill="url(#skinG)"/>
<path d="M108 86 C 106 66, 124 60, 138 70 C 144 76, 142 90, 138 100 C 134 86, 120 80, 110 92Z" fill="#3a2418"/>
<path d="M120 64 C 150 58, 168 90, 172 130 C 178 180, 188 210, 196 230 L 104 230 C 100 200, 98 170, 104 140 C 106 110, 104 80, 120 64 Z" fill="url(#veilG)" opacity=".78"/>
<g stroke="#fff" stroke-opacity=".55" fill="none" stroke-width=".8"><path d="M126 70 C 146 90, 156 140, 170 220"/><path d="M122 72 C 136 100, 140 150, 150 226"/><path d="M118 76 C 124 110, 124 170, 128 228"/><path d="M114 82 C 112 120, 112 180, 112 228"/></g>
<circle cx="126" cy="64" r="3" fill="#f3d488"/><circle cx="131" cy="63" r="2" fill="#f3d488"/><circle cx="121" cy="63" r="2" fill="#f3d488"/>
<g transform="translate(104 168)"><circle r="9" fill="#8a1f33"/><circle cx="-8" cy="6" r="6" fill="#f3ece6"/><circle cx="8" cy="5" r="6" fill="#a83248"/><path d="M-12 12 q12 10 24 0" fill="#6b7a5a"/></g>
</svg>`;
$("photoBox").innerHTML = CONFIG.photo ? `<img src="${CONFIG.photo}" alt="العروسان">` : COUPLE_SVG;

// التواريخ
const ev = new Date(CONFIG.eventDate);
const fmt = o => ev.toLocaleDateString(LOC, o);
const dayName = fmt({weekday:"long"}), dayNum = fmt({day:"numeric"}),
      month = fmt({month:"long"}), year = fmt({year:"numeric"});
const timeTxt = ev.toLocaleTimeString(LOC,{hour:"numeric",minute:"2-digit"});
$("dateLine").textContent  = `يوم ${dayName}، ${dayNum} ${month} ${year}`;
$("timeLine").textContent  = `الساعة ${timeTxt}`;
$("venueLine").textContent = `في ${CONFIG.venueName}`;
["1","2"].forEach(n => {
  $("dayName"+n).textContent = dayName;
  $("startTxt"+n).textContent = `الساعة ${timeTxt}`;
  $("dayNum"+n).textContent = dayNum;
  $("month"+n).textContent = month;
  $("year"+n).textContent = year;
});

// التقويم
(function(){
  const y = ev.getFullYear(), m = ev.getMonth();
  $("calTitle").textContent = `${month} ${year}`;
  let html = ["أح","إث","ث","أر","خ","ج","س"].map(n => `<div class="wd">${n}</div>`).join("");
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
  for (let i=0;i<first;i++) html += `<div></div>`;
  for (let d=1; d<=days; d++) html += `<div class="d${d===ev.getDate()?" hit":""}"><span>${d}</span></div>`;
  $("calGrid").innerHTML = html;
})();

// رابط Google Calendar
(function(){
  const z = d => d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const end = new Date(ev.getTime() + 4*3600*1000);
  const p = new URLSearchParams({action:"TEMPLATE",
    text:`حفل زفاف ${plain(CONFIG.groomName)} و${plain(CONFIG.brideName)}`,
    dates:`${z(ev)}/${z(end)}`, location:CONFIG.venueName, details:CONFIG.mapUrl});
  $("calLink").href = "https://calendar.google.com/calendar/render?" + p.toString();
})();

// العد التنازلي
function tick(){
  const diff = ev - new Date();
  if (diff <= 0){
    $("countdown").outerHTML = '<div class="cd-done">🎉 حان موعد الفرح، مبارك للعروسين</div>';
    clearInterval(timer); return;
  }
  $("cdD").textContent = Math.floor(diff/864e5);
  $("cdH").textContent = Math.floor(diff/36e5)%24;
  $("cdM").textContent = Math.floor(diff/6e4)%60;
  $("cdS").textContent = Math.floor(diff/1e3)%60;
}
const timer = setInterval(tick,1000); tick();

// الموسيقى: تشتغل تلقائياً أول ما ينفتح الظرف
const song = $("song");
if (CONFIG.musicFile) song.src = CONFIG.musicFile;
song.loop = true;
function playMusic(){
  if (!CONFIG.musicFile) return;
  try { song.currentTime = CONFIG.musicStartAt || 0; } catch(e){}
  song.volume = 0;
  song.play().then(() => {
    let v = 0; const f = setInterval(() => { v = Math.min(1, v + .05); song.volume = v; if (v>=1) clearInterval(f); }, 120);
  }).catch(() => {});
}

// فتح الظرف
let opened = false;
$("intro").addEventListener("click", () => {
  if (opened) return; opened = true;
  playMusic();
  $("intro").classList.add("opening");
  setTimeout(() => $("flash").classList.add("on"), 1300);
  setTimeout(() => {
    $("intro").classList.add("gone");
    document.body.classList.remove("locked");
    window.scrollTo(0,0);
    $("flash").classList.remove("on");
  }, 2100);
});

// ظهور الأقسام عند التمرير
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add("visible"); io.unobserve(e.target); }
}), {threshold:.12});
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

// نافذة تأكيد الحضور
const sheet = $("sheet");
$("openRsvp").onclick = () => sheet.classList.add("open");
$("closeSheet").onclick = $("sheetBg").onclick = () => sheet.classList.remove("open");
document.querySelectorAll('input[name="attend"]').forEach(r => r.addEventListener("change", () => {
  const yes = document.querySelector('input[name="attend"]:checked').value === "yes";
  $("compField").style.opacity = yes ? 1 : .35;
  $("companions").disabled = !yes;
}));
$("rsvpForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("guestName").value.trim(); if (!name) return;
  const yes = document.querySelector('input[name="attend"]:checked').value === "yes";
  const comp = parseInt($("companions").value) || 0;
  const g = plain(CONFIG.groomName), b = plain(CONFIG.brideName);
  let msg = `السلام عليكم 🌸\nأنا: ${name}\n`;
  msg += yes ? `✅ أؤكد حضوري حفل زفاف ${g} و${b}\nعدد المرافقين: ${comp}`
             : `🙏 أعتذر عن الحضور، وأبارك للعروسين ${g} و${b}`;
  window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`, "_blank");
  sheet.classList.remove("open");
});
</script>

</html>
